services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coloxel
      POSTGRES_PASSWORD: coloxel
      POSTGRES_DB: coloxel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coloxel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

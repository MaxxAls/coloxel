<title>Atelier Pixel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: the room canvas is the stage, a narrow workbench column on the right holds creation, item card and inventory. Single night look. */
:root{
  --bg:#17132a; --panel:#221c3b; --line:#3a3160; --fg:#f3ecdf; --muted:#a99fc4; --accent:#ffc857; --accent-ink:#2a1d00; --danger:#ff8a80;
  --f-display:"Silkscreen",ui-monospace,monospace; --f-body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;color:var(--accent);letter-spacing:.02em}
header p{margin:0;color:var(--muted)}
.main{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.stage{flex:1 1 560px;min-width:0;background:#120f22;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.stage canvas{display:block;margin:0 auto;image-rendering:pixelated;cursor:pointer;max-width:100%;touch-action:manipulation}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:20px}
.side{flex:0 1 320px;min-width:0;width:100%;display:flex;flex-direction:column;gap:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.label{font-family:var(--f-display);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
textarea{width:100%;box-sizing:border-box;min-height:74px;resize:vertical;background:#15112a;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:800;border-radius:8px;border:1px solid var(--line);background:#2c2550;color:var(--fg);padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.ideas button{font-weight:600;font-size:12.5px;padding:5px 9px;border-radius:999px;background:transparent;color:var(--muted)}
.status{font-size:13px;color:var(--muted);min-height:20px}
.status.err{color:var(--danger)}
.card{display:flex;gap:12px;align-items:center}
.card canvas{image-rendering:pixelated;background:#15112a;border:1px solid var(--line);border-radius:8px;flex:none}
.card .meta{min-width:0;display:flex;flex-direction:column;gap:2px}
.card .name{font-family:var(--f-display);font-size:15px;color:var(--fg);overflow-wrap:anywhere}
.card .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.serial{font-variant-numeric:tabular-nums;color:var(--accent)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.inv button{padding:4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:11px;background:#15112a;min-width:0}
.inv button.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.inv button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.inv canvas{image-rendering:pixelated}
.empty{font-size:13px;color:var(--muted)}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.dots i{width:6px;height:6px;background:var(--accent);animation:b 1s infinite steps(2)}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>Atelier Pixel</h1>
    <p>Décris un objet, il naît en exemplaire unique, tu le poses dans ta chambre.</p>
  </header>
  <div class="main">
    <section class="stage" aria-label="Ta chambre">
      <canvas id="room" width="300" height="216" aria-label="Chambre en pixel art isométrique"></canvas>
      <div class="hint" id="hint">Clique sur le sol pour te déplacer. Clique un objet pour voir sa fiche.</div>
    </section>
    <aside class="side">
      <div class="box">
        <div class="label">Créer un objet</div>
        <textarea id="desc" maxlength="200" placeholder="ex : un bocal avec une mini tempête dedans"></textarea>
        <div class="ideas" id="ideas">
          <button type="button">une borne d'arcade qui fume</button>
          <button type="button">un lit en forme de croissant</button>
          <button type="button">un aquarium avec un requin</button>
        </div>
        <div class="row">
          <button class="primary" id="make" type="button">Créer</button>
          <button id="stop" type="button" hidden>Arrêter</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </div>
      <div class="box" id="cardBox" hidden>
        <div class="label">Fiche objet</div>
        <div class="card">
          <canvas id="cardCv" width="96" height="112" style="width:96px;height:112px"></canvas>
          <div class="meta">
            <div class="name" id="cName"></div>
            <div class="sub" id="cDesc"></div>
            <div class="sub" id="cSerial"></div>
          </div>
        </div>
        <div class="row">
          <button class="primary" id="cPlace" type="button">Placer</button>
          <button id="cStore" type="button">Ranger</button>
        </div>
      </div>
      <div class="box">
        <div class="label">Inventaire</div>
        <div class="inv" id="inv"></div>
        <div class="empty" id="invEmpty">Tout est posé dans ta chambre.</div>
      </div>
    </aside>
  </div>
</div>

<script>
(()=>{
const SW=96,SH=112,AX=48,AY=88;
const W=300,H=216,OX=150,OY=80,N=8;
const OUT='#1b1530';
const room=document.getElementById('room'),rg=room.getContext('2d');
rg.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);

function hex(c){return /^#[0-9a-fA-F]{6}$/.test(c)?c:'#999999'}
function shade(c,f){c=hex(c);let r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);const t=f<0?0:255,k=Math.abs(f);r=Math.round(r+(t-r)*k);g=Math.round(g+(t-g)*k);b=Math.round(b+(t-b)*k);return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
function num(v,lo,hi,d){v=Number(v);if(!isFinite(v))v=d;return Math.max(lo,Math.min(hi,v))}

function makeSprite(parts){
  const cv=document.createElement('canvas');cv.width=SW;cv.height=SH;const g=cv.getContext('2d');
  const P=(x,y,z)=>[AX+(x-y),AY+(x+y)/2-z];
  const px=(x,y,c)=>{g.fillStyle=c;g.fillRect(x,y,1,1)};
  function ins(X,Y,p){let k=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[a,b]=p[i],[c,d]=p[j];if((b>Y)!=(d>Y)&&X<(c-a)*(Y-b)/(d-b)+a)k=!k}return k}
  function poly(p,c){g.fillStyle=c;const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]);for(let y=Math.floor(Math.min(...ys));y<=Math.ceil(Math.max(...ys));y++)for(let x=Math.floor(Math.min(...xs));x<=Math.ceil(Math.max(...xs));x++)if(ins(x+.5,y+.5,p))g.fillRect(x,y,1,1)}
  function q(a,b,c,d,col){poly([P(...a),P(...b),P(...c),P(...d)],col)}
  function ell(cx,cy,rx,ry,c){if(rx<.5||ry<.5)return;g.fillStyle=c;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const a=(x+.5-cx)/rx,b=(y+.5-cy)/ry;if(a*a+b*b<=1)g.fillRect(x,y,1,1)}}
  for(const p of (parts||[]).slice(0,80)){
    if(!p||typeof p!=='object')continue;
    const L=-14,R=14,Z=70;
    if(p.t==='box'){
      const x0=num(p.x0,L,R,-4),x1=num(p.x1,L,R,4),y0=num(p.y0,L,R,-4),y1=num(p.y1,L,R,4),z0=num(p.z0,0,Z,0),z1=num(p.z1,0,Z,4);
      const base=hex(p.c||p.top),top=hex(p.top||base),le=hex(p.left||shade(base,-.18)),ri=hex(p.right||shade(base,-.34));
      q([x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],ri);
      q([x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1],le);
      q([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],top);
    }else if(p.t==='quad'&&Array.isArray(p.pts)&&p.pts.length>=3){
      poly(p.pts.slice(0,6).map(a=>P(num(a[0],L,R,0),num(a[1],L,R,0),num(a[2],0,Z,0))),hex(p.c));
    }else if(p.t==='cyl'){
      const r=num(p.r,.5,12,3),[cx,cb]=P(num(p.x,L,R,0),num(p.y,L,R,0),num(p.z0,0,Z,0)),ct=cb-(num(p.z1,0,Z,6)-num(p.z0,0,Z,0));
      const rx=r*1.41,ry=rx/2,side=hex(p.side||p.c),top=hex(p.top||shade(side,.18));
      ell(cx,cb,rx,ry,shade(side,-.2));
      g.fillStyle=side;g.fillRect(Math.round(cx-rx),Math.round(ct),Math.round(rx),Math.max(0,Math.round(cb-ct)));
      g.fillStyle=shade(side,-.2);g.fillRect(Math.round(cx),Math.round(ct),Math.round(rx),Math.max(0,Math.round(cb-ct)));
      ell(cx,ct,rx,ry,top);
    }else if(p.t==='sphere'){
      const r=num(p.r,.5,14,3),[cx,cy]=P(num(p.x,L,R,0),num(p.y,L,R,0),num(p.z,0,Z,4)),c=hex(p.c);
      for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++)for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++){const dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy<=r*r){const s=(dx+dy)/r;px(x,y,s>.55?shade(c,-.28):s<-.75?shade(c,.35):c)}}
    }else if(p.t==='circle'){
      const r=num(p.r,.5,12,2),[cx,cy]=P(num(p.x,L,R,0),num(p.y,L,R,0),num(p.z,0,Z,2));
      ell(cx,cy,r,r,hex(p.c));if(p.c2)ell(cx,cy,r/2,r/2,hex(p.c2));
    }else if(p.t==='pix'){
      const[x,y]=P(num(p.x,L,R,0),num(p.y,L,R,0),num(p.z,0,Z,0));
      g.fillStyle=hex(p.c);g.fillRect(Math.round(x),Math.round(y),Math.round(num(p.w,1,8,1)),Math.round(num(p.h,1,8,1)));
    }
  }
  const im=g.getImageData(0,0,SW,SH),d=im.data,a=new Uint8Array(SW*SH);
  for(let i=0;i<SW*SH;i++)a[i]=d[i*4+3]>40?1:0;
  const o=[parseInt(OUT.slice(1,3),16),parseInt(OUT.slice(3,5),16),parseInt(OUT.slice(5,7),16)];
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const i=y*SW+x;if(a[i])continue;if((x>0&&a[i-1])||(x<SW-1&&a[i+1])||(y>0&&a[i-SW])||(y<SH-1&&a[i+SW])){d[i*4]=o[0];d[i*4+1]=o[1];d[i*4+2]=o[2];d[i*4+3]=255}}
  g.putImageData(im,0,0);
  const mask=new Uint8Array(SW*SH);for(let i=0;i<SW*SH;i++)mask[i]=d[i*4+3]>40?1:0;
  return {cv,mask};
}

const SEED=[
 {name:'Chocolatine GT',desc:'une voiture en forme de pain au chocolat',parts:[
  {t:'circle',x:-6,y:-4.5,z:2.5,r:3,c:'#1c1c1c',c2:'#9a9a9a'},{t:'circle',x:6,y:-4.5,z:2.5,r:3,c:'#1c1c1c',c2:'#9a9a9a'},
  {t:'box',x0:-9,x1:9,y0:-4.5,y1:4.5,z0:2,z1:9,c:'#e8a94a'},
  {t:'quad',pts:[[-9,4.5,4],[9,4.5,4],[9,4.5,4.8],[-9,4.5,4.8]],c:'#9c6420'},
  {t:'quad',pts:[[-9,4.5,6.4],[9,4.5,6.4],[9,4.5,7.2],[-9,4.5,7.2]],c:'#9c6420'},
  {t:'quad',pts:[[9,-4.5,5.6],[9,4.5,5.6],[9,4.5,6.4],[9,-4.5,6.4]],c:'#7f5018'},
  {t:'pix',x:-5,y:-2,z:9,w:2,h:1,c:'#b8721f'},{t:'pix',x:4,y:1,z:9,w:2,h:1,c:'#b8721f'},{t:'pix',x:-7,y:2,z:9,w:1,h:1,c:'#fff3d6'},
  {t:'box',x0:-3,x1:4,y0:-3.5,y1:3.5,z0:9,z1:13,c:'#f0b85a'},
  {t:'quad',pts:[[-2,3.5,10],[3,3.5,10],[3,3.5,12.3],[-2,3.5,12.3]],c:'#9ad0f5'},
  {t:'quad',pts:[[4,-2.5,10],[4,2.5,10],[4,2.5,12.3],[4,-2.5,12.3]],c:'#7fb6db'},
  {t:'box',x0:9,x1:10.5,y0:-4,y1:4,z0:4,z1:5,c:'#6b3d22'},{t:'box',x0:9,x1:10.5,y0:-4,y1:4,z0:7,z1:8,c:'#6b3d22'},
  {t:'pix',x:9,y:-3.5,z:3.2,w:2,h:1,c:'#ffe58a'},{t:'pix',x:9,y:3,z:3.2,w:2,h:1,c:'#ffe58a'},
  {t:'circle',x:-6,y:4.5,z:2.5,r:3,c:'#1c1c1c',c2:'#9a9a9a'},{t:'circle',x:6,y:4.5,z:2.5,r:3,c:'#1c1c1c',c2:'#9a9a9a'}]},
 {name:'Monstera Zen',desc:'une grande plante dans un pot en terre cuite',parts:[
  {t:'cyl',x:0,y:0,r:3.5,z0:0,z1:7,top:'#5a3a22',side:'#d9774a'},
  {t:'sphere',x:-1,y:1,z:11,r:4,c:'#3f9b4b'},{t:'sphere',x:1,y:-1,z:14,r:4,c:'#4fb35a'},{t:'sphere',x:0,y:1,z:17,r:3,c:'#6fcf6a'}]},
 {name:'Table de mamie',desc:'une petite table en bois avec un mug',parts:[
  {t:'box',x0:-6,x1:-5,y0:-6,y1:-5,z0:0,z1:9,c:'#6e4a2c'},{t:'box',x0:5,x1:6,y0:-6,y1:-5,z0:0,z1:9,c:'#6e4a2c'},
  {t:'box',x0:-6,x1:-5,y0:5,y1:6,z0:0,z1:9,c:'#6e4a2c'},{t:'box',x0:5,x1:6,y0:5,y1:6,z0:0,z1:9,c:'#6e4a2c'},
  {t:'box',x0:-7,x1:7,y0:-7,y1:7,z0:9,z1:11,c:'#8b5e3c'},
  {t:'cyl',x:1,y:1,r:1.6,z0:11,z1:14.5,top:'#7a4a2a',side:'#f2f2f2'}]}
];

let S;
function fresh(){
  const now=Date.now();
  return {serial:3,avatar:{i:5,j:2},items:SEED.map((s,k)=>({id:'seed'+k,n:k+1,name:s.name,desc:s.desc,parts:s.parts,at:now,ex:true})),placed:{seed0:{i:2,j:5},seed1:{i:0,j:0},seed2:{i:4,j:5}}};
}
try{S=JSON.parse(localStorage.getItem('atelier.v1')||'null')}catch(e){S=null}
if(!S||!Array.isArray(S.items))S=fresh();
function save(){try{localStorage.setItem('atelier.v1',JSON.stringify(S))}catch(e){}}

const sprites={};
function spr(it){return sprites[it.id]||(sprites[it.id]=makeSprite(it.parts))}

const floor=document.createElement('canvas');floor.width=W;floor.height=H;
(function(){
  const g=floor.getContext('2d');
  const r=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,Math.max(1,Math.round(h)))};
  const top=OY-8,L=N*16,WH=58;
  for(let x=OX-L;x<OX;x++){const yb=top+(OX-x)*.5;r(x,yb-WH,1,WH,'#8a7fc0');r(x,yb-WH,1,2,'#5d538f');r(x,yb-3,1,3,'#5d538f')}
  for(let x=OX;x<OX+L;x++){const yb=top+(x-OX)*.5;r(x,yb-WH,1,WH,'#6c61a3');r(x,yb-WH,1,2,'#4a4180');r(x,yb-3,1,3,'#4a4180')}
  for(let x=OX-92;x<OX-56;x++){const yb=top+(OX-x)*.5;r(x,yb-46,1,26,'#f7e7b8');}
  for(let x=OX-89;x<OX-59;x++){const yb=top+(OX-x)*.5;r(x,yb-44,1,22,'#2b3a6b');}
  [[-80,-40],[-70,-36],[-64,-30],[-84,-30]].forEach(([dx,dy])=>{const x=OX+dx,yb=top+(OX-x)*.5;r(x,yb+dy,1,1,'#f7e7b8')});
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const cx=OX+(i-j)*16,cy=OY+(i+j)*8,c=(i+j)%2?'#c79a62':'#b88b56';
    for(let x=cx-16;x<cx+16;x++){const d=16-Math.abs(x-cx+.5);r(x,cy-d/2,1,d,c)}
    r(cx-16,cy,1,1,'#9c7444');
  }
  const fy=OY+(2*N-1)*8;
  for(let x=OX-L;x<OX+L;x++){const yb=fy+8-Math.abs(x-OX)*.5;r(x,yb-.5,1,3,'#7b5a34')}
})();

const AV=["  hhhhh  "," hhhhhhh "," hsssssh "," ssesess "," sssssss ","  sssss  ","   sss   ","  ttttt  "," ttttttt ","sttttttts","sttttttts","s ttttt s","  ppppp  ","  pp pp  ","  pp pp  ","  pp pp  ","  pp pp  "," kkk kkk "];
const AP={h:'#4a2c1a',s:'#f1c27d',e:'#222222',t:'#e2483d',p:'#2b4a8b',k:'#1a1a1a'};

const tc=(i,j)=>[OX+(i-j)*16,OY+(i+j)*8];
let path=[],avPos=null,stepT=0,hover=null,placing=null,selected=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function occupied(i,j,except){for(const id in S.placed){if(id===except)continue;const p=S.placed[id];if(p.i===i&&p.j===j)return true}return false}
function bfs(a,b){
  if(occupied(b.i,b.j))return [];
  const key=(i,j)=>i*N+j,prev=new Map([[key(a.i,a.j),null]]),qu=[a];
  while(qu.length){const c=qu.shift();if(c.i===b.i&&c.j===b.j)break;
    for(const[di,dj]of[[1,0],[-1,0],[0,1],[0,-1]]){const i=c.i+di,j=c.j+dj;if(i<0||j<0||i>=N||j>=N||prev.has(key(i,j))||occupied(i,j))continue;prev.set(key(i,j),c);qu.push({i,j})}}
  if(!prev.has(key(b.i,b.j)))return [];
  const out=[];let c=b;while(c&&!(c.i===a.i&&c.j===a.j)){out.unshift(c);c=prev.get(key(c.i,c.j))}return out;
}

function draw(t){
  rg.clearRect(0,0,W,H);rg.drawImage(floor,0,0);
  if(hover&&placing){const[cx,cy]=tc(hover.i,hover.j);const ok=!occupied(hover.i,hover.j)&&!(S.avatar.i===hover.i&&S.avatar.j===hover.j);rg.fillStyle=ok?'rgba(255,200,87,.45)':'rgba(255,138,128,.45)';for(let x=cx-16;x<cx+16;x++){const d=16-Math.abs(x-cx+.5);rg.fillRect(x,Math.round(cy-d/2),1,Math.max(1,Math.round(d)))}}
  const list=[];
  for(const id in S.placed){const it=S.items.find(x=>x.id===id);if(!it)continue;const p=S.placed[id];list.push({k:p.i+p.j,it,p})}
  if(path.length&&t-stepT>(reduce?60:150)){S.avatar=path.shift();stepT=t;if(!path.length)save()}
  list.push({k:S.avatar.i+S.avatar.j+.5,av:true});
  list.sort((a,b)=>a.k-b.k);
  for(const e of list){
    if(e.av){const[cx,cy]=tc(S.avatar.i,S.avatar.j);const bob=path.length&&!reduce?((Math.floor(t/150)%2)):0;
      rg.fillStyle='rgba(0,0,0,.25)';for(let x=cx-6;x<cx+6;x++){const d=6-Math.abs(x-cx+.5);rg.fillRect(x,Math.round(cy-d/2),1,Math.max(1,Math.round(d)))}
      AV.forEach((row,y)=>[...row].forEach((ch,x)=>{if(AP[ch]){rg.fillStyle=AP[ch];rg.fillRect(cx-4+x,cy-19+y-bob,1,1)}}));continue}
    const[cx,cy]=tc(e.p.i,e.p.j),s=spr(e.it);
    rg.drawImage(s.cv,cx-AX,cy-AY);
    if(selected===e.it.id&&!placing){rg.fillStyle='#ffc857';rg.fillRect(cx-1,cy-AY+4,3,3)}
  }
  requestAnimationFrame(draw);
}

function toCanvas(ev){const r=room.getBoundingClientRect();return[(ev.clientX-r.left)*W/r.width,(ev.clientY-r.top)*H/r.height]}
function tileAt(mx,my){const a=(mx-OX)/16,b=(my-OY)/8;const i=Math.round((a+b)/2),j=Math.round((b-a)/2);return(i>=0&&j>=0&&i<N&&j<N)?{i,j}:null}
function itemAt(mx,my){
  const ids=Object.keys(S.placed).sort((a,b)=>(S.placed[b].i+S.placed[b].j)-(S.placed[a].i+S.placed[a].j));
  for(const id of ids){const it=S.items.find(x=>x.id===id);if(!it)continue;const p=S.placed[id],[cx,cy]=tc(p.i,p.j);const x=Math.floor(mx-(cx-AX)),y=Math.floor(my-(cy-AY));if(x>=0&&y>=0&&x<SW&&y<SH&&spr(it).mask[y*SW+x])return it}
  return null;
}
room.addEventListener('pointermove',ev=>{const[x,y]=toCanvas(ev);hover=tileAt(x,y)});
room.addEventListener('pointerleave',()=>{hover=null});
room.addEventListener('click',ev=>{
  const[x,y]=toCanvas(ev);
  if(placing){const t=tileAt(x,y);if(!t)return;
    if(occupied(t.i,t.j,placing)||(S.avatar.i===t.i&&S.avatar.j===t.j)){hint('Case occupée, choisis une autre case.');return}
    S.placed[placing]={i:t.i,j:t.j};selected=placing;placing=null;save();renderSide();hint('Posé. Clique un objet pour le déplacer ou le ranger.');return}
  const it=itemAt(x,y);if(it){selected=it.id;renderSide();return}
  const t=tileAt(x,y);if(t){path=bfs(S.avatar,t);if(!path.length&&!(t.i===S.avatar.i&&t.j===S.avatar.j))hint("Impossible d'aller là.")}
});
function hint(s){$('hint').textContent=s}

function mini(it,size){const c=document.createElement('canvas');c.width=48;c.height=56;const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(spr(it).cv,24,40,48,56,0,0,48,56);c.style.width=size+'px';c.style.height=Math.round(size*56/48)+'px';return c}
function renderSide(){
  const inv=$('inv');inv.innerHTML='';
  const free=S.items.filter(it=>!S.placed[it.id]);
  free.forEach(it=>{const b=document.createElement('button');b.type='button';if(it.id===selected)b.className='sel';b.append(mini(it,48));const s=document.createElement('span');s.textContent=it.name;b.append(s);b.onclick=()=>{selected=it.id;placing=null;renderSide()};inv.append(b)});
  $('invEmpty').hidden=free.length>0;
  const it=S.items.find(x=>x.id===selected);
  $('cardBox').hidden=!it;
  if(it){
    const g=$('cardCv').getContext('2d');g.clearRect(0,0,SW,SH);g.drawImage(spr(it).cv,0,0);
    $('cName').textContent=it.name;
    $('cDesc').textContent='« '+it.desc+' »';
    const d=new Date(it.at).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
    $('cSerial').innerHTML='';const sp=document.createElement('span');sp.className='serial';sp.textContent='N° '+String(it.n).padStart(4,'0');
    $('cSerial').append(sp,document.createTextNode(' · Exemplaire 1/1 · '+(it.ex?'exemple':'créé par toi')+' · '+d));
    const on=!!S.placed[it.id];
    $('cPlace').textContent=placing===it.id?'Choisis une case…':on?'Déplacer':'Placer';
    $('cStore').hidden=!on;
  }
}
$('cPlace').onclick=()=>{if(!selected)return;placing=selected;hint('Clique une case libre pour poser l’objet. Échap pour annuler.');renderSide()};
$('cStore').onclick=()=>{if(!selected)return;delete S.placed[selected];placing=null;save();renderSide();hint('Rangé dans l’inventaire.')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&placing){placing=null;renderSide();hint('Placement annulé.')}});
document.querySelectorAll('#ideas button').forEach(b=>b.onclick=()=>{$('desc').value=b.textContent;$('desc').focus()});

function fit(){const w=room.parentElement.clientWidth-26;let s=w/W;s=s>=2?Math.floor(s):Math.max(1,s);room.style.width=Math.round(W*s)+'px';room.style.height=Math.round(H*s)+'px'}
addEventListener('resize',fit);fit();

const PROMPT=`Tu es le générateur d'objets d'un jeu social en pixel art isométrique (vue 2:1, sprites de 96x112 px). Le joueur décrit un objet, tu le construis avec des primitives géométriques.

Repère : x et y au sol, de -12 à 12 (une case de sol va de -8 à 8 ; reste dans -8..8 sauf objet long), z vers le haut de 0 à 60. Un point (x,y,z) s'affiche à l'écran à dx = x - y, dy = (x+y)/2 - z. Le spectateur voit le dessus, la face y = max (à gauche) et la face x = max (à droite). Les parties sont dessinées DANS L'ORDRE de la liste : commence par ce qui est derrière et en bas (x et y petits), finis par ce qui est devant et les petits détails.

Primitives (couleurs en hex #rrggbb) :
- {"t":"box","x0":..,"x1":..,"y0":..,"y1":..,"z0":..,"z1":..,"c":"#.."} pavé ; les faces latérales sont ombrées automatiquement (option "top","left","right" pour forcer).
- {"t":"cyl","x":..,"y":..,"r":..,"z0":..,"z1":..,"side":"#..","top":"#.."} cylindre vertical.
- {"t":"sphere","x":..,"y":..,"z":..,"r":..,"c":"#.."} boule ombrée (r en pixels écran).
- {"t":"circle","x":..,"y":..,"z":..,"r":..,"c":"#..","c2":"#.."} disque plat face écran (roues, yeux, boutons), c2 optionnel au centre.
- {"t":"quad","pts":[[x,y,z],[x,y,z],[x,y,z],[x,y,z]],"c":"#.."} polygone libre (écrans, vitres, motifs sur une face, toits en pente).
- {"t":"pix","x":..,"y":..,"z":..,"w":1..4,"h":1..4,"c":"#.."} petit bloc de pixels (reflets, étincelles, détails).

Style : lisible et mignon, 3 à 6 teintes cohérentes et saturées, 10 à 40 parties. Le détail fait le charme : reflets, boutons, coutures, petites lumières. L'objet doit être reconnaissable au premier coup d'oeil. Les objets humoristiques ou absurdes doivent garder leur idée centrale bien visible.

Si la description est sexuelle, haineuse, gore, représente une personne réelle ou une marque/un personnage protégé, réponds {"refus":"raison courte en français"}.

Réponds UNIQUEMENT avec un objet JSON : {"nom":"nom court et drôle en français, 2 à 4 mots","parts":[...]}

Exemple pour "une petite table en bois avec un mug" :
{"nom":"Table de mamie","parts":[{"t":"box","x0":-6,"x1":-5,"y0":-6,"y1":-5,"z0":0,"z1":9,"c":"#6e4a2c"},{"t":"box","x0":5,"x1":6,"y0":-6,"y1":-5,"z0":0,"z1":9,"c":"#6e4a2c"},{"t":"box","x0":-6,"x1":-5,"y0":5,"y1":6,"z0":0,"z1":9,"c":"#6e4a2c"},{"t":"box","x0":5,"x1":6,"y0":5,"y1":6,"z0":0,"z1":9,"c":"#6e4a2c"},{"t":"box","x0":-7,"x1":7,"y0":-7,"y1":7,"z0":9,"z1":11,"c":"#8b5e3c"},{"t":"cyl","x":1,"y":1,"r":1.6,"z0":11,"z1":14.5,"side":"#f2f2f2","top":"#7a4a2a"}]}

Description du joueur : `;

const ERR={not_granted:"Autorise Claude pour créer des objets.",sampling_disabled:"La création n'est pas disponible sur ce compte.",rate_limited:"Trop de créations d'un coup. Réessaie dans un moment.",session_expired:"Reconnecte-toi puis réessaie.",refused:"Cette description a été refusée. Essaie autre chose.",invalid_json:"L'objet est sorti tout cassé. Réessaie.",empty_completion:"Rien n'est sorti. Reformule ta description."};
let sample=null,ctl=null;
(async()=>{try{sample=await window.claude?.use?.('sample')}catch(e){sample=null}
  if(!sample){$('make').disabled=true;status("La création d'objets ne marche que dans Claude. Tu peux quand même jouer avec les exemples.",true)}})();
function status(s,err,busy){const el=$('status');el.className='status'+(err?' err':'');el.innerHTML='';if(busy){const d=document.createElement('span');d.className='dots';d.innerHTML='<i></i><i></i><i></i>';el.append(d)}el.append(document.createTextNode(s))}

$('make').onclick=async()=>{
  const desc=$('desc').value.trim();
  if(desc.length<3){status('Décris ton objet en quelques mots.',true);$('desc').focus();return}
  if(!sample)return;
  ctl=new AbortController();$('make').disabled=true;$('stop').hidden=false;status('Fabrication de ton objet…',false,true);
  try{
    const r=await sample.json(PROMPT+desc,{signal:ctl.signal,cache:false});
    if(r&&r.refus){status(String(r.refus).slice(0,160),true);return}
    if(!r||!Array.isArray(r.parts)||!r.parts.length){status("L'objet est sorti tout cassé. Réessaie.",true);return}
    S.serial=(S.serial||0)+1;
    const it={id:'it'+Date.now().toString(36),n:S.serial,name:String(r.nom||desc).slice(0,40),desc:desc.slice(0,200),parts:r.parts.slice(0,80),at:Date.now()};
    S.items.push(it);selected=it.id;placing=it.id;save();renderSide();
    status('« '+it.name+' » est né. N° '+String(it.n).padStart(4,'0')+', exemplaire unique.');
    hint('Clique une case libre pour poser ton nouvel objet. Échap pour le garder en inventaire.');
    $('desc').value='';
  }catch(e){if(e&&e.code==='cancelled')status('Création arrêtée.');else status(ERR[e&&e.code]||"Problème de connexion. Réessaie.",true);
    if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'))hardStop=true}
  finally{$('stop').hidden=true;ctl=null;$('make').disabled=hardStop}
};
let hardStop=false;
$('stop').onclick=()=>ctl?.abort();
$('desc').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('make').click()}});

renderSide();requestAnimationFrame(draw);
})();
</script>
